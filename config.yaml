# Configuration du simulateur de valeurs fictives.
#
# Fichier reecrit automatiquement des qu'une variable est ajoutee ou supprimee
# (autosave). Les commentaires de la version precedente sont perdus : la
# derniere version ecrite a la main est conservee dans config.yaml.bak.
# La liste complete des generateurs et de leurs parametres est dans README.md.
scan_ms: 200
autosave: true
modbus:
  enabled: true
  host: 0.0.0.0
  port: 502
  unit_id: 1
  word_order: big
  mirror_input_registers: true
  mirror_discrete_inputs: true
  size: 2000
opcua:
  enabled: true
  host: 0.0.0.0
  port: 4840
  endpoint_path: /freeopcua/server/
  uri: http://datatest.simulator
  server_name: DataTest Simulator
  folder: Simulation
  allow_anonymous: true
bacnet:
  enabled: true
  host: 0.0.0.0
  prefix_length: 24
  port: 47808
  device_id: 599
  device_name: DataTest-Simulator
  vendor_id: 999
  vendor_name: DataTest
  model_name: Simulateur de valeurs fictives
  description: Generateur de valeurs simulees
s7:
  enabled: true
  host: 0.0.0.0
  port: 102
  db_number: 1
  size: 1024
  bool_bytes: 16
  rack: 0
  slot: 1
web:
  enabled: true
  host: 0.0.0.0
  port: 8080
tags:
- name: temperature
  dtype: float32
  generator:
    type: sine
    amplitude: 25.0
    offset: 75.0
    period: 60
  description: Temperature du four (sinusoide autour de 75 degres)
  unit: degC
  address: 0
  bacnet_instance: 1
  s7_offset: 16
- name: pression
  dtype: float32
  generator:
    type: gaussian
    mean: 4.2
    sigma: 0.15
    period: 1
  description: Pression procede, bruit gaussien
  unit: bar
  address: 2
  bacnet_instance: 2
  s7_offset: 20
- name: niveau_cuve
  dtype: float32
  generator:
    type: triangle
    min: 0
    max: 100
    period: 120
  description: Remplissage lent puis vidange (triangle)
  unit: '%'
  address: 4
  bacnet_instance: 3
  s7_offset: 24
- name: debit
  dtype: float32
  generator:
    type: random_walk
    start: 50
    step: 4
    min: 0
    max: 100
  description: Marche aleatoire bornee
  unit: m3/h
  address: 6
  bacnet_instance: 4
  s7_offset: 28
- name: Alarme
  dtype: bool
  generator:
    type: manual
    value: false
  address: 0
  bacnet_instance: 1
  s7_offset: 0
  s7_bit: 0
- name: Alarme_2
  dtype: bool
  generator:
    type: manual
    value: false
  address: 1
  bacnet_instance: 2
  s7_offset: 0
  s7_bit: 1
- name: Compteur
  dtype: float32
  generator:
    type: counter
    start: 0
    step: 1
    period: 1
    max: 6553500
  address: 8
  bacnet_instance: 5
  s7_offset: 32
- name: Lot
  dtype: bool
  generator:
    type: manual
    value: false
  address: 2
  bacnet_instance: 3
  s7_offset: 0
  s7_bit: 2
